<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Borel&family=Pacifico&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/d879469828.js" crossorigin="anonymous"></script>
    <title id="page-title"></title>
    <link rel="icon" type="image/x-icon" href="images/fav.ico" />
</head>

<body class="bg-neutral">
    <section>
        <div class="bg-white w-[30%] rounded-xl px-5 py-4">
            <h1 class="text-4xl text-main font-main pb-8">Stash in drawer...</h1>
            <div class="flex">
                <input type="text"
                    class="mt-1 leading-loose text-xl w-full border-b border-neutral px-3 py-2 focus:outline-none text-main font-sec font-extrabold" />
                <input type="datetime-local" class="px-3 py-2 pr-10 text-neutral font-sec focus:outline-none" />
                <button type="button" data-open-picker class="absolute right-2 top-1/2 -translate-y-1/2"
                    aria-label="Open date picker">
                    <i class="fa-regular fa-calendar text-neutral"></i>
                </button>
            </div>
            <div class="flex">
                <input type="checkbox">
                AM
                </input>
            </div>
            <div>
                <input type="checkbox">
                Repeat?
                </input>
                <button>Dropdown</button>
                <div class="hidden">
                    <ul>
                        <li>Daily</li>
                        <li>Weekly</li>
                        <li>Monthly</li>
                        <li>Yearly</li>
                    </ul>
                </div>
            </div>
        </div>
    </section>
    <section class="mt-44">
        <div class="bg-white w-[30%] rounded-xl px-5 py-4">
            <h1 class="text-4xl text-main font-main pb-8">Your drawer</h1>
            <ul class="flex flex-col gap-4">
                <li class="flex justify-between items-center">
                    <span class="text-neutral font-sec">Item 1</span>
                    <button class="text-red-500 hover:text-red-900"><i class="fa-solid fa-trash"></i></button>
                </li>
                <li class="flex justify-between items-center">
                    <span class="text-neutral font-sec">Item 2</span>
                    <button class="text-red-500 hover:text-red-900"><i class="fa-solid fa-trash"></i></button>
                </li>
                <li class="flex justify-between items-center">
                    <span class="text-neutral font-sec">Item 3</span>
                    <button class="text-red-500 hover:text-red-900"><i class="fa-solid fa-trash"></i></button>
                </li>
            </ul>
        </div>
    </section>
</body>

</html>
